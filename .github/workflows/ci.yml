name: CI

on:
  pull_request:
  # Run by hand on any branch, e.g. before a release.
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - appcast.xml
      - "**/*.md"
      - docs/**
      - website/**

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the Xcode used for releases; the app targets the macOS 27 SDK.
  DEVELOPER_DIR: /Applications/Xcode_27.1_beta.app/Contents/Developer

jobs:
  build:
    name: Build app
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ hashFiles('Framecho.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # The runner's Xcode ships without the Metal toolchain, which the
      # Studio motion-blur shader needs.
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build (Debug, unsigned)
        run: |
          status=0
          xcodebuild build \
            -project Framecho.xcodeproj \
            -scheme Framecho \
            -configuration Debug \
            -destination "platform=macOS" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/build.log" 2>&1 || status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" "$RUNNER_TEMP/build.log" || true
          exit "$status"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log

  checks:
    name: Standalone checks
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Each check's result is added to the job summary.
      - name: Run scripts/run-checks.sh
        run: scripts/run-checks.sh

      - name: Upload check logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs
          path: ${{ runner.temp }}/framecho-checks/logs

  release-tool:
    name: Release tool
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./cmd/...
      - run: go test ./cmd/...
